[package]
name = "toolbay-runner"
version = "1.0.0"
description = "Toolbay runner: opens a web app, local server or command-line tool as its own desktop window"
authors = ["Toolbay"]
license = "MIT"
repository = "https://github.com/sriptcollector/toolbay-builds"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
