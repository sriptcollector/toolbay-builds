<!doctype html>
<html><head><meta charset="utf-8"><title>Starting…</title>
<style>
html,body{margin:0;height:100%;background:#0a0a0a;color:#ededed;font:15px "Segoe UI",system-ui,sans-serif}
body{display:grid;place-items:center}
.box{text-align:center}
.bar{width:180px;height:3px;background:#232323;border-radius:3px;overflow:hidden;margin:18px auto 0}
.bar i{display:block;width:40%;height:100%;background:#8b6dff;animation:s 1.1s ease-in-out infinite}
@keyframes s{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
</style></head>
<body><div class="box"><div>Starting the app…</div><div class="bar"><i></i></div></div></body></html>
